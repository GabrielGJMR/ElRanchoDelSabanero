# /etc/nginx/sites-available/rancho  (cambie tudominio.com por su dominio)
# Certbot agrega solo el bloque de HTTPS (443) al ejecutar: sudo certbot --nginx -d tudominio.com -d www.tudominio.com

server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com;

    # El backend admite archivos de 5 MB y solicitudes multipart de hasta 6 MB.
    client_max_body_size 6m;

    # Los archivos con hash (/assets/*) nunca cambian: se pueden guardar un año
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Limita los intentos de adivinar la clave del panel de administración
    location /api/admin/ {
        limit_req zone=rancho_admin burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
