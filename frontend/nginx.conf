server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
	server_tokens off;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los archivos con hash (/assets/*) nunca cambian: se pueden guardar un año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /admin {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    # Rutas de React Router: si el archivo no existe en disco, cae a index.html
    # y deja que React Router decida qué mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
