<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin | El Rancho del Sabanero</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin">
  <main class="wrap">
    <h1>Administración del menú</h1>

    <form id="login">
      <label>Usuario <input name="username" value="admin" required autocomplete="username"></label>
      <label>Clave <input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Entrar</button>
      <p id="loginMsg" class="note" role="status"></p>
    </form>

    <div id="panel" hidden>
      <p><button id="logout" class="btn sm">Cerrar sesión</button></p>
      <div id="menuEdit"></div>
      <h3>Nueva categoría</h3>
      <div class="row cat-row">
        <input id="newCatName" placeholder="Nombre (ej. Postres)">
        <input id="newCatNote" placeholder="Nota (opcional)">
        <button id="newCatBtn" class="btn sm">Agregar</button>
      </div>
    </div>
  </main>
  <script src="admin.js"></script>
</body>
</html>
