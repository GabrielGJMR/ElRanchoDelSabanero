spring.application.name=backend

# Base de datos (PostgreSQL). Los valores por defecto son solo para desarrollo local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rancho}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:dev}

# Flyway crea las tablas; Hibernate solo valida que coincidan con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Fotos de los platillos subidas desde el panel (en el VPS: carpeta fuera del jar, ver deploy/DEPLOY.md)
app.uploads-dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Servidor. En el VPS corre detras de Nginx (HTTPS), que enviara las cabeceras X-Forwarded-*
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.shutdown=graceful

# Administrador del panel (/admin.html). Si ADMIN_PASSWORD esta vacio se genera una clave temporal al arrancar.
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:}
