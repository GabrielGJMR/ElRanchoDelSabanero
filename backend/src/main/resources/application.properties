spring.application.name=backend

# Base de datos (PostgreSQL). Los valores por defecto son solo para desarrollo local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rancho}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:dev}

# Flyway crea las tablas; Hibernate solo valida que coincidan con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Administrador del panel (/admin.html). Si ADMIN_PASSWORD esta vacio se genera una clave temporal al arrancar.
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:}
