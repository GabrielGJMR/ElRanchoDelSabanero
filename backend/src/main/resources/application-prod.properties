# Perfil de produccion: se activa con SPRING_PROFILES_ACTIVE=prod
# Solo escucha en el equipo: Nginx es quien recibe el trafico de internet.
server.address=127.0.0.1

# No mostrar detalles internos en las respuestas de error
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.jpa.show-sql=false
logging.level.root=INFO
