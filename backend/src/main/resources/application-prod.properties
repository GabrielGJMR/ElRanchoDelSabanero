# Perfil de produccion: se activa con SPRING_PROFILES_ACTIVE=prod
# Corre en su propio contenedor Docker: Caddy (otro contenedor) es quien recibe el trafico de internet
# y reenvia por la red interna de Docker, asi que este servicio debe escuchar en todas las interfaces
# (no solo 127.0.0.1, que dentro del contenedor no seria alcanzable desde afuera).

# No mostrar detalles internos en las respuestas de error
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.jpa.show-sql=false
logging.level.root=INFO
